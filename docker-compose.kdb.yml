# KDB platform production stack (consolidated, 2 services).
#
# This stack owns an independent Postgres database and exposes KDB through a
# single Go binary (kdb-app) that runs the lookup API (9100) + admin UI (9101)
# + worker/autopilot in one process and execs the `codex` CLI directly.
# Mediafine and sibling sites must consume KDB through the API, not by reading
# KDB tables from their own application databases.
#
# Previous 5-service stack preserved at docker-compose.kdb.5svc.yml.bak.

name: kdb-platform

services:
  kdb-db:
    image: postgres:16-alpine
    container_name: kdb-db
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: "${KDB_POSTGRES_DB:-kdb}"
      POSTGRES_USER: "${KDB_POSTGRES_USER:-kdb}"
      POSTGRES_PASSWORD: "${KDB_POSTGRES_PASSWORD:?KDB_POSTGRES_PASSWORD required}"
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kdb_internal
    ports:
      - "127.0.0.1:${KDB_POSTGRES_HOST_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KDB_POSTGRES_USER:-kdb} -d ${KDB_POSTGRES_DB:-kdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kdb-app:
    build:
      context: .
      dockerfile: Dockerfile.kdb-app
    image: "${KDB_APP_IMAGE:-kdb-app:bottleneck-20260710-4}"
    container_name: kdb-app
    restart: unless-stopped
    depends_on:
      kdb-db:
        condition: service_healthy
    env_file: [.env]
    working_dir: /app
    # Production executes the binary baked into the tagged image. A restart no
    # longer compiles every dirty workspace edit, and rollback is an image tag.
    command: ["/usr/local/bin/kdb-app"]
    # Run as the host kdb user so the bind-mounted CODEX_HOME (auth.json, sqlite
    # logs) keeps consistent ownership between host and container, and so codex
    # can write into /codex-home.
    user: "${KDB_HOST_UID:-1014}:${KDB_HOST_GID:-1014}"
    environment:
      # Go 빌드: 모듈캐시를 쓰기가능 위치로(기본 /go/pkg/mod 는 read-only, 신규 deps 추가불가).
      # /app/.gomodcache = /go/pkg/mod 복사본 + 신규 deps(2026-06-28 opencc). 재시작 시 go build
      # 가 여기서 의존성을 찾는다(서비스 빌드 안전). gitignore 됨.
      GOMODCACHE: "/app/.gomodcache"
      GOSUMDB: "off"
      GOFLAGS: "-buildvcs=false"
      # API (from old kdb-api)
      KDB_API_PORT: "9100"
      KDB_API_REQUEST_TIMEOUT_SECONDS: "${KDB_API_REQUEST_TIMEOUT_SECONDS:-10}"
      KDB_API_KEYS: "${KDB_API_KEYS:-}"
      # Admin (from old kdb-admin)
      KDB_ADMIN_PORT: "9101"
      KDB_ADMIN_SESSION_SECRET: "${KDB_ADMIN_SESSION_SECRET:-}"
      KDB_BUILD_VERSION: "${KDB_BUILD_VERSION:-bottleneck-20260710-4}"
      # Worker / autopilot (from old kdb-worker)
      KDB_WORKER_FAST_INTERVAL_SECONDS: "30"
      KDB_WORKER_POLL_INTERVAL_SECONDS: "900"
      KDB_AUTOPILOT_INTERVAL_SECONDS: "${KDB_AUTOPILOT_INTERVAL_SECONDS:-1800}"
      # codex CLI (direct exec — replaces codex-bridge)
      CODEX_BIN: "codex"
      CODEX_MODEL: "${CODEX_MODEL:-gpt-5.5}"
      CODEX_BRIDGE_MODEL: "${CODEX_BRIDGE_MODEL:-gpt-5.5}"
      CODEX_REASONING_EFFORT: "${CODEX_REASONING_EFFORT:-medium}"
      # role 별 reasoning effort 차등(토큰 절감). 비우면 위 전역값 사용.
      # 다국어 합성(FillLocale)·Disambiguator·dataqa 는 지식회상/고난도 판단이라
      # 전역(high) 유지. 단순 추출/이진 분류만 낮춘다.
      CODEX_EFFORT_EXTRACT: "${CODEX_EFFORT_EXTRACT:-low}"        # RSS 표기 추출(최대 볼륨)
      CODEX_EFFORT_CLASSIFY: "${CODEX_EFFORT_CLASSIFY:-medium}"   # entity_type 분류
      CODEX_EFFORT_GATEKEEPER: "${CODEX_EFFORT_GATEKEEPER:-medium}" # keep/reject 이진
      CODEX_EFFORT_RECONCILE: "${CODEX_EFFORT_RECONCILE:-medium}"  # 동일인 판정 이진
      CODEX_BRIDGE_TIMEOUT_MS: "${CODEX_BRIDGE_TIMEOUT_MS:-90000}"
      CODEX_BRIDGE_FORCE_MODEL: "${CODEX_BRIDGE_FORCE_MODEL:-0}"
      CODEX_HOME: "/codex-home"
      HOME: "/tmp"
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/kdb/.cache/go-build
      - /home/kdb.aiinplanet.com/.codex:/codex-home:rw
    networks:
      - kdb_internal
      - mediafine_default
      - dockeraiinplanetcom_backend
    ports:
      - "127.0.0.1:9100:9100"
      - "127.0.0.1:9101:9101"
    expose:
      - "9100"
      - "9101"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9100/v1/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # kdb-searxng — 자체 호스팅 메타검색(무료·무카드·무키). websearch provider 가
  # 내부망에서 http://kdb-searxng:8080/search?format=json 로 호출(외부 미노출).
  # 여러 엔진 메타검색이라 한 엔진이 막혀도 다른 엔진이 받음(단일 스크래퍼보다 견고).
  kdb-searxng:
    image: searxng/searxng:latest
    container_name: kdb-searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - kdb_internal
    expose:
      - "8080"

volumes:
  pgdata:
    name: kdb-platform_pgdata
  go-mod-cache:
  go-build-cache:

networks:
  kdb_internal:
  mediafine_default:
    external: true
  dockeraiinplanetcom_backend:
    external: true
