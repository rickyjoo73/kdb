# KDB platform production stack (consolidated, 2 services).
#
# This stack owns an independent Postgres database and exposes KDB through a
# single Go binary (kdb-app) that runs the lookup API (9100) + admin UI (9101)
# + worker/autopilot in one process and execs the `codex` CLI directly.
# Mediafine and sibling sites must consume KDB through the API, not by reading
# KDB tables from their own application databases.
#
# Previous 5-service stack preserved at docker-compose.kdb.5svc.yml.bak.

name: kdb-platform

services:
    # ★현실적인 자원 한도 (2026-09-14). 종전엔 세 컨테이너 모두 mem_limit 16g · cpus 8.0,
    # 즉 **16GB 8스레드 장비에서 각자 장비 전체**를 허용받고 있었다. 그건 한도가 아니라
    # "다 가져가라"다. 같은 호스트에 사이트 컨테이너가 40개 넘게 살고 있고, 실제로 한 앱이
    # CPU 375%(3.75코어)를 혼자 쓰는 것을 관측했다. 막는 것이 없었다.
    #
    # 값은 실측 + 여유로 정했다. 조이는 것이 목적이 아니다 — 너무 낮으면 OOM 으로 죽는다.
    #   kdb-db 실측 1.95GB(shared_buffers 1GB 포함) → 6g. VACUUM·병렬워커·백엔드 여유 포함 3배.
    #   병렬 질의는 max_parallel_workers_per_gather=2 라 한 질의가 최대 3프로세스 → 4코어면 충분.
  kdb-db:
    mem_limit: 6g
    cpus: "4.0"
    cpu_shares: 1024
    # ★/dev/shm 을 1GB 로 올린다 (2026-09-14, D-39).
    # Docker 기본은 64MB 다. Postgres 는 병렬 질의의 동적 공유메모리(dynamic_shared_memory_type
    # = posix)를 /dev/shm 에 잡는데, 공통 원장이 53만 행이 된 뒤 집계가 여러 개 동시에
    # 병렬로 뜨면 `could not resize shared memory segment ... No space left on device` 로
    # **질의가 죽는다**(실측). 디스크는 495GB 남아 있으니 디스크 문제가 아니라 이 64MB 가
    # 문제다. 메시지가 "No space left on device" 라 디스크를 보게 만드는 게 이 결함의 함정이다.
    # 이 값을 바꾸면 컨테이너가 재생성되므로 배포(CI)는 kdb-db 를 건드리지 않는다
    # (--no-deps kdb-app 만). 적용은 서버에서 의도적으로 한 번 한다.
    shm_size: 1gb
    image: postgres:16-alpine
    container_name: kdb-db
    restart: unless-stopped
    # ★기본값 탈출 (2026-09-14). 여기 값들은 전부 **이 장비를 실측하고** 정했다.
    #   · 장비: 램 15.9GB(가용 5.2GB) · /data 는 SSD(ROTA=0) · 스와핑 없음(si/so≈0)
    #   · DB 3.8GB, 이 호스트에 사이트 컨테이너 13개가 같이 산다
    # shared_buffers 는 **1GB 까지만** 올린다. 처음엔 4GB 를 생각했는데, 가용 5.2GB 의
    # 대부분이 회수 가능한 페이지 캐시라 4GB 를 떼면 다른 사이트를 스왑으로 민다.
    # random_page_cost 4 는 회전 디스크 가정이다 — SSD 에서 인덱스 스캔을 부당하게
    # 비싸게 보고 순차 스캔을 고른다. 이건 메모리를 안 쓰고 계획만 바꾸는 무료 개선이다.
    # work_mem 은 연결·노드마다 잡히므로 크게 올리지 않는다(16MB × 동시 노드).
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    env_file: [.env]
    environment:
      POSTGRES_DB: "${KDB_POSTGRES_DB:-kdb}"
      POSTGRES_USER: "${KDB_POSTGRES_USER:-kdb}"
      POSTGRES_PASSWORD: "${KDB_POSTGRES_PASSWORD:?KDB_POSTGRES_PASSWORD required}"
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kdb_internal
    ports:
      - "127.0.0.1:${KDB_POSTGRES_HOST_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KDB_POSTGRES_USER:-kdb} -d ${KDB_POSTGRES_DB:-kdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # kdb-app 실측 94MB 이지만 codex CLI 를 exec 하고 go build 경로가 있어 순간 급증할 수
    # 있다. 3g 는 실측의 30배 여유다 — 조이려는 값이 아니라 폭주를 막는 천장이다.
  kdb-app:
    mem_limit: 3g
    cpus: "2.0"
    cpu_shares: 1024
    build:
      context: .
      dockerfile: Dockerfile.kdb-app
    image: "${KDB_APP_IMAGE:-kdb-app:bottleneck-20260710-4}"
    container_name: kdb-app
    restart: unless-stopped
    depends_on:
      kdb-db:
        condition: service_healthy
    env_file: [.env]
    working_dir: /app
    # Production executes the binary baked into the tagged image. A restart no
    # longer compiles every dirty workspace edit, and rollback is an image tag.
    command: ["/usr/local/bin/kdb-app"]
    # Run as the host kdb user so the bind-mounted CODEX_HOME (auth.json, sqlite
    # logs) keeps consistent ownership between host and container, and so codex
    # can write into /codex-home.
    user: "${KDB_HOST_UID:-1014}:${KDB_HOST_GID:-1014}"
    environment:
      # 호스트·cron·kdb-db 가 전부 KST 인데 여기만 비어 UTC 로 돌았다. 같은 로그 파일에
      # 9시간 어긋난 두 시각이 섞여(스크립트 KST + 앱 UTC) 정체 판단을 오도한다.
      TZ: Asia/Seoul
      # Go 빌드: 모듈캐시를 쓰기가능 위치로(기본 /go/pkg/mod 는 read-only, 신규 deps 추가불가).
      # /app/.gomodcache = /go/pkg/mod 복사본 + 신규 deps(2026-06-28 opencc). 재시작 시 go build
      # 가 여기서 의존성을 찾는다(서비스 빌드 안전). gitignore 됨.
      GOMODCACHE: "/app/.gomodcache"
      GOSUMDB: "off"
      GOFLAGS: "-buildvcs=false"
      # API (from old kdb-api)
      KDB_API_PORT: "9100"
      KDB_API_REQUEST_TIMEOUT_SECONDS: "${KDB_API_REQUEST_TIMEOUT_SECONDS:-10}"
      KDB_API_KEYS: "${KDB_API_KEYS:-}"
      # Admin (from old kdb-admin)
      KDB_ADMIN_PORT: "9101"
      KDB_ADMIN_SESSION_SECRET: "${KDB_ADMIN_SESSION_SECRET:-}"
      KDB_BUILD_VERSION: "${KDB_BUILD_VERSION:-bottleneck-20260710-4}"
      # Worker / autopilot (from old kdb-worker)
      KDB_WORKER_FAST_INTERVAL_SECONDS: "30"
      KDB_WORKER_POLL_INTERVAL_SECONDS: "900"
      KDB_AUTOPILOT_INTERVAL_SECONDS: "${KDB_AUTOPILOT_INTERVAL_SECONDS:-1800}"
      # codex CLI (direct exec — replaces codex-bridge)
      CODEX_BIN: "codex"
      # 운영자 지시 2026-09-16 저녁: 정정 검증 판정을 gpt-5.6 · effort low 로.
      CODEX_MODEL: "${CODEX_MODEL:-gpt-5.6}"
      CODEX_BRIDGE_MODEL: "${CODEX_BRIDGE_MODEL:-gpt-5.6}"
      CODEX_REASONING_EFFORT: "${CODEX_REASONING_EFFORT:-medium}"
      # role 별 reasoning effort 차등(토큰 절감). 비우면 위 전역값 사용.
      # 다국어 합성(FillLocale)·Disambiguator·dataqa 는 지식회상/고난도 판단이라
      # 전역(high) 유지. 단순 추출/이진 분류만 낮춘다.
      CODEX_EFFORT_EXTRACT: "${CODEX_EFFORT_EXTRACT:-low}"        # RSS 표기 추출(최대 볼륨)
      CODEX_EFFORT_CLASSIFY: "${CODEX_EFFORT_CLASSIFY:-medium}"   # entity_type 분류
      CODEX_EFFORT_GATEKEEPER: "${CODEX_EFFORT_GATEKEEPER:-medium}" # keep/reject 이진
      CODEX_EFFORT_RECONCILE: "${CODEX_EFFORT_RECONCILE:-medium}"  # 동일인 판정 이진
      CODEX_EFFORT_CORRECTION: "${CODEX_EFFORT_CORRECTION:-low}"   # 정정 검증(운영자 지시: low)
      # ★codex 는 **이 역할 하나에만** 쓴다 (2026-09-16 저녁).
      #   정정 검증은 근거를 하나도 주지 않고 "이 로케일 매체가 실제로 쓰는 표기가
      #   무엇인가"를 묻는 순수 지식 과제라 모델 힘이 직접 는다. 하루 평균 21건 ·
      #   최대 49건 · 프롬프트 300~400 토큰으로 짧고 적다.
      #   뉴스근거 판정(VERIFY, 하루 342건 · 스니펫 5건)과 유입 분류는 gemma 로 둔다 —
      #   그쪽은 읽는 과제라 모델을 바꿔도 소용이 없었고(근거를 두껍게 해서 고쳤다) 양도 많다.
      KDB_LLM_CORRECTION: "${KDB_LLM_CORRECTION:-codex}"
      # 라우팅만으로는 부족하다. 새 레인이 실수로 이 역할을 쓰거나 재시도가 폭주하면
      # 조용히 늘어난다. 상한을 넘기면 **멈추지 않고 gemma 로 내려가고, 내려간 사실을
      # 원장에 사실대로 적는다**(오늘 «codex 검증» 608건이 거짓 이름표였다).
      KDB_CODEX_DAILY_CALLS: "${KDB_CODEX_DAILY_CALLS:-60}"
      CODEX_BRIDGE_TIMEOUT_MS: "${CODEX_BRIDGE_TIMEOUT_MS:-90000}"
      CODEX_BRIDGE_FORCE_MODEL: "${CODEX_BRIDGE_FORCE_MODEL:-0}"
      CODEX_HOME: "/codex-home"
      HOME: "/tmp"
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/kdb/.cache/go-build
      - /home/kdb.aiinplanet.com/.codex:/codex-home:rw
    networks:
      - kdb_internal
      - mediafine_default
      - dockeraiinplanetcom_backend
    ports:
      - "127.0.0.1:9100:9100"
      - "127.0.0.1:9101:9101"
    expose:
      - "9100"
      - "9101"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9100/v1/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # kdb-searxng — 자체 호스팅 메타검색(무료·무카드·무키). websearch provider 가
  # 내부망에서 http://kdb-searxng:8080/search?format=json 로 호출(외부 미노출).
  # 여러 엔진 메타검색이라 한 엔진이 막혀도 다른 엔진이 받음(단일 스크래퍼보다 견고).
    # kdb-searxng 실측 86MB. 내부 메타검색이라 부하가 작다.
  kdb-searxng:
    mem_limit: 1g
    cpus: "1.0"
    cpu_shares: 1024
    image: searxng/searxng:latest
    container_name: kdb-searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - kdb_internal
    expose:
      - "8080"

volumes:
  pgdata:
    name: kdb-platform_pgdata
  go-mod-cache:
  go-build-cache:

networks:
  kdb_internal:
  mediafine_default:
    external: true
  dockeraiinplanetcom_backend:
    external: true
