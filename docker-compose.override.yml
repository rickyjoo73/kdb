# Host-specific override for server59 (paths/network names differ from server52).
services:
  kdb-app:
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/kdb/.cache/go-build
      - /data/home2/kdb.aiinplanet.com/.codex:/codex-home:rw
    networks:
      - kdb_internal
      - mediafine_default
      - dockers_backend

networks:
  dockeraiinplanetcom_backend:
    external: false
  dockers_backend:
    external: true
