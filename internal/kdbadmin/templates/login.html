{{define "login.html"}}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>로그인 — KDB Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <form method="POST" action="/admin/login" class="bg-white shadow rounded-lg p-8 w-full max-w-sm">
    <h1 class="text-xl font-semibold mb-1">KDB Admin</h1>
    <p class="text-slate-500 text-sm mb-6">kdb.aiinplanet.com</p>

    {{if .error}}
    <div class="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded mb-4 text-sm">{{.error}}</div>
    {{end}}

    {{if .next}}<input type="hidden" name="next" value="{{.next}}">{{end}}

    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
    <input type="text" name="email" value="{{.email}}" required autofocus autocomplete="username"
           class="w-full border rounded px-3 py-2 mb-3">

    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
    <input type="password" name="password" required autocomplete="current-password"
           class="w-full border rounded px-3 py-2 mb-6">

    <button class="w-full bg-slate-900 text-white py-2 rounded hover:bg-slate-800">로그인</button>

    <div class="text-[11px] text-slate-400 text-center mt-6">
      KDB 관리 콘솔 · Phase 4 · 운영자 전용
    </div>
  </form>
</body>
</html>
{{end}}
