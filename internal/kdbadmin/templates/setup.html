{{define "setup.html"}}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>최초 관리자 등록 — KDB Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <form method="POST" action="/admin/setup" class="bg-white shadow rounded-lg p-8 w-full max-w-md">
    <h1 class="text-xl font-semibold mb-1">KDB Admin · 최초 관리자 등록</h1>
    <p class="text-slate-500 text-sm mb-6">
      관리자 계정이 아직 없습니다. 이 페이지는 첫 관리자가 만들어지는 즉시 비활성화됩니다.
    </p>

    {{if .error}}
    <div class="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded mb-4 text-sm">{{.error}}</div>
    {{end}}

    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
    <input type="email" name="email" value="{{.email}}" required autofocus autocomplete="username"
           class="w-full border rounded px-3 py-2 mb-3">

    <label class="block text-sm font-medium text-slate-700 mb-1">표시 이름 (선택)</label>
    <input type="text" name="name" value="{{.name}}" autocomplete="name"
           class="w-full border rounded px-3 py-2 mb-3">

    <label class="block text-sm font-medium text-slate-700 mb-1">비밀번호 (8자 이상)</label>
    <input type="password" name="password" required autocomplete="new-password" minlength="8"
           class="w-full border rounded px-3 py-2 mb-3">

    <label class="block text-sm font-medium text-slate-700 mb-1">비밀번호 확인</label>
    <input type="password" name="confirm" required autocomplete="new-password" minlength="8"
           class="w-full border rounded px-3 py-2 mb-6">

    <button class="w-full bg-slate-900 text-white py-2 rounded hover:bg-slate-800">관리자 생성 후 로그인</button>

    <div class="text-[11px] text-slate-400 text-center mt-6">
      KDB 관리 콘솔 · Phase 4 · 최초 부팅 setup
    </div>
  </form>
</body>
</html>
{{end}}
