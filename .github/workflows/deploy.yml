name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ★배포 전 게이트 (2026-09-01). 종전엔 이게 없어서 컴파일 에러가 서버에서, 그것도
  # `compose up -d` 로 컨테이너를 이미 갈아치운 뒤에야 드러났다 — 빌드 실패 = 프로덕션 정지.
  # 러너에서 먼저 세우고 돌린다. 실패하면 SSH 근처도 못 간다.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key
          printf '%s\n' "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/prod_key
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to production
        env:
          PROD_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_USER: ${{ secrets.PROD_SSH_USER }}
          # 2026-08-04: 실제 프로젝트 경로로 수정 (기존 /home/kdb.aiinplanet.com 는
          # 존재하지 않는 경로라 매 배포가 여기서 실패했음).
          DEPLOY_PATH: /data/home2/kdb.aiinplanet.com
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/prod_key \
            -p "$PROD_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$PROD_USER@$PROD_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "$DEPLOY_SHA" ]; then
            echo "Deployed SHA $current_sha does not match expected SHA $DEPLOY_SHA" >&2
            exit 1
          fi

          # 2026-08-04: 기존엔 git pull만 하고 끝나서 코드가 컨테이너에 실제로
          # 반영되지 않았음(docs/KDB_HERMES_DEPLOY.md 의 수동 b단계를 여기 자동화).
          # kdb-db/kdb-searxng 는 건드리지 않고 kdb-app만 재빌드+재기동.

          # ★compose 파일 2개를 반드시 명시한다 (2026-09-01).
          # 종전엔 -f 없이 `docker compose` 만 불러 .env 의 COMPOSE_FILE 에 의존했다.
          # 그런데 compose 는 -f 를 안 주면 기본 파일명(docker-compose.yml)만 자동
          # 병합하고, 이 저장소 기본 파일은 docker-compose.kdb.yml 이다. COMPOSE_FILE
          # 이 비거나 base 한 개만 담고 있으면 override 가 통째로 빠지고, 그 override 가
          # 들고 있는 게 하필 dockers_backend 고정 IP(172.19.0.240)다. 빠지면 컨테이너가
          # 동적 IP로 재생성되고 그 IP를 무관한 컨테이너가 물려받아 nginx 가
          # kdb.aiinplanet.com 트래픽을 엉뚱한 곳으로 보낸다(42차 핸드오프 §0, 08-06 실증).
          # CLI 의 -f 는 COMPOSE_FILE 보다 우선하므로, 서버 .env 상태와 무관하게 항상
          # 수동 런북과 같은 조합으로 뜬다.
          COMPOSE="docker compose -f docker-compose.kdb.yml -f docker-compose.override.yml"

          # ★이미지 태그와 KDB_BUILD_VERSION 을 커밋마다 승격한다 (2026-09-01).
          # 종전엔 둘 다 그대로 둔 채 build 만 해서 (a) 매 배포가 같은 태그를 덮어써
          # compose 주석의 "rollback is an image tag" 가 무력화됐고, (b) /v1/health 의
          # version 은 이미지 태그가 아니라 KDB_BUILD_VERSION 을 그대로 읽으므로
          # (kdbapi/api.go) 새 바이너리가 도는데 헬스는 옛 태그를 보고했다 — 배포 검증
          # 절차 자체가 거짓말을 했다(42차 핸드오프 §0, 08-06 실증).
          TAG="ci-$(date +%Y%m%d)-$(git rev-parse --short=7 HEAD)"

          set_env() {
            key="$1"; val="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              printf '%s=%s\n' "$key" "$val" >> .env
            fi
          }
          read_env() { sed -n "s|^$1=||p" .env | tail -1; }

          env_backup=".env.bak.$(date +%Y%m%d%H%M%S)"
          cp .env "$env_backup"
          prev_image="$(read_env KDB_APP_IMAGE || true)"
          echo "==> Previous image: ${prev_image:-<unset>} / new tag: kdb-app:$TAG"

          set_env KDB_APP_IMAGE "kdb-app:$TAG"
          set_env KDB_BUILD_VERSION "$TAG"

          # ★서버 .env 의 COMPOSE_FILE 도 두 파일로 맞춘다 (2026-09-01).
          # 위의 -f 는 CI 경로만 지킨다. 사람이 서버에서 맨손으로 `docker compose` 를
          # 부르면 여전히 이 변수에 운명이 걸린다 — 비어 있으면 override 가 빠진다.
          # 여기서 못 박아 수동 경로까지 같은 조합이 되게 한다.
          want_compose_file="docker-compose.kdb.yml:docker-compose.override.yml"
          cur_compose_file="$(read_env COMPOSE_FILE || true)"
          echo "==> COMPOSE_FILE (before): ${cur_compose_file:-<unset>}"
          if [ "$cur_compose_file" != "$want_compose_file" ]; then
            set_env COMPOSE_FILE "$want_compose_file"
            echo "==> COMPOSE_FILE normalized to: $want_compose_file"
          fi

          rollback() {
            echo "==> Rolling back .env to $env_backup (image ${prev_image:-<unset>})" >&2
            cp "$env_backup" .env
            $COMPOSE up -d --no-deps kdb-app || true
          }

          echo "==> Rebuilding kdb-app image (kdb-app:$TAG)..."
          if ! $COMPOSE build kdb-app; then
            echo "build failed — .env restored, running container untouched" >&2
            cp "$env_backup" .env
            exit 1
          fi

          # ★마이그레이션을 코드보다 먼저 적용한다 (2026-09-01).
          # 종전엔 배포에 이 단계가 아예 없었고 main.go 에 자동적용 경로도 없다. 그래서
          # migrations/0115_*.sql 을 추가한 커밋을 푸시하면 없는 컬럼을 읽는 코드가 먼저
          # 떴다. 원장(kdb_schema_migrations)에 없는 파일만 번호순으로 적용한다.
          #
          # ★전건 재실행은 안 된다: 64개 중 21개가 UPDATE/DELETE 를 담은 데이터 교정이고
          # (0106 접미사 제거·0110 타입 교정·0113 폭0 문자 제거 등) 이들은 멱등이 아니다.
          # 그래서 "다 돌린다"가 아니라 원장 대조가 필수다.
          #
          # ★부트스트랩: 원장이 없던 첫 배포에서는 지금 저장소에 있는 파일 전부를
          # '이미 적용됨'으로 표시만 하고 실행하지 않는다. 프로덕션은 46차 핸드오프 기준
          # 0114 까지 손으로 적용된 상태이고 저장소 최대도 0114 이므로 그게 사실이다.
          # 이 커밋은 새 마이그레이션을 추가하지 않으므로 부트스트랩 시점이 정확히 맞다.
          pg_user="$(read_env KDB_POSTGRES_USER || true)"; pg_user="${pg_user:-kdb}"
          pg_db="$(read_env KDB_POSTGRES_DB || true)";     pg_db="${pg_db:-kdb}"
          psql_run() { docker exec -i kdb-db psql -X -q -v ON_ERROR_STOP=1 -U "$pg_user" -d "$pg_db" "$@"; }

          ledger_existed="$(psql_run -tAc "SELECT to_regclass('public.kdb_schema_migrations') IS NOT NULL")"
          psql_run -c "CREATE TABLE IF NOT EXISTS kdb_schema_migrations (
            filename   text PRIMARY KEY,
            applied_at timestamptz NOT NULL DEFAULT now(),
            applied_by text        NOT NULL DEFAULT 'ci'
          )" >/dev/null

          if [ "$ledger_existed" != "t" ]; then
            echo "==> Migration ledger absent — BOOTSTRAP: marking present migrations as already applied (not executing them)."
            for f in migrations/*.sql; do
              psql_run -c "INSERT INTO kdb_schema_migrations(filename, applied_by)
                           VALUES ('$(basename "$f")','bootstrap') ON CONFLICT DO NOTHING" >/dev/null
            done
            echo "==> Bootstrapped $(ls migrations/*.sql | wc -l) entries. Future deploys apply only new files."
          else
            applied_now=0
            for f in $(ls migrations/*.sql | sort); do
              b="$(basename "$f")"
              if [ "$(psql_run -tAc "SELECT 1 FROM kdb_schema_migrations WHERE filename='$b'")" = "1" ]; then
                continue
              fi
              echo "==> Applying migration $b ..."
              if ! psql_run -f - < "$f"; then
                echo "migration $b FAILED — container untouched, .env restored." >&2
                echo "NOTE: migrations are forward-only; inspect the DB before retrying." >&2
                cp "$env_backup" .env
                exit 1
              fi
              psql_run -c "INSERT INTO kdb_schema_migrations(filename) VALUES ('$b')" >/dev/null
              applied_now=$((applied_now + 1))
            done
            echo "==> Migrations applied this deploy: $applied_now"
          fi

          echo "==> Recreating kdb-app (kdb-db/kdb-searxng untouched)..."
          if ! $COMPOSE up -d --no-deps kdb-app; then
            rollback
            exit 1
          fi

          echo "==> Waiting for healthcheck..."
          healthy=0
          for i in $(seq 1 20); do
            status="$(docker inspect kdb-app --format '{{.State.Health.Status}}' 2>/dev/null || echo unknown)"
            echo "    [$i] $status"
            if [ "$status" = "healthy" ]; then
              healthy=1
              break
            fi
            sleep 3
          done
          if [ "$healthy" != "1" ]; then
            echo "kdb-app did not become healthy within 60s — check 'docker logs kdb-app'" >&2
            rollback
            exit 1
          fi

          # 배포가 실제로 반영됐는지 두 가지로 확인한다. version 은 이제 위에서 태그와
          # 함께 올렸으므로 일치해야 하고, 고정 IP 는 nginx 오라우팅 방지선이다.
          served_version="$(docker exec kdb-app curl -fsS http://127.0.0.1:9100/v1/health 2>/dev/null \
            | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)"
          echo "==> /v1/health version: ${served_version:-<none>} (expected $TAG)"
          if [ "$served_version" != "$TAG" ]; then
            echo "health version mismatch — new binary is not serving" >&2
            rollback
            exit 1
          fi

          app_ip="$(docker inspect kdb-app \
            --format '{{index .NetworkSettings.Networks "dockers_backend" "IPAddress"}}' 2>/dev/null || true)"
          echo "==> dockers_backend IP: ${app_ip:-<none>} (expected 172.19.0.240)"
          if [ "$app_ip" != "172.19.0.240" ]; then
            echo "static IP lost — override was not applied; nginx may misroute" >&2
            rollback
            exit 1
          fi

          echo "==> kdb-app healthy on kdb-app:$TAG."
          exit 0
          EOF
